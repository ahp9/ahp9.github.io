<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive D3 Line Chart</title>
  <script src="https://d3js.org/d3.v6.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 30px;
    }
    svg {
      background-color: #f9f9f9;
    }
    select {
      margin-bottom: 20px;
      padding: 5px;
    }
  </style>
</head>
<body>

  <h2>Value Over Time</h2>
  <label for="yearSelect">Select Year:</label>
  <select id="yearSelect"></select>
  <div id="chart"></div>

  <script>
    // Sample data for multiple years
    const dataset = {
      "2020": [
        { date: new Date(2020, 0, 1), value: 30 },
        { date: new Date(2020, 1, 1), value: 50 },
        { date: new Date(2020, 2, 1), value: 80 },
        { date: new Date(2020, 3, 1), value: 65 },
        { date: new Date(2020, 4, 1), value: 95 },
        { date: new Date(2020, 5, 1), value: 40 }
      ],
      "2021": [
        { date: new Date(2021, 0, 1), value: 60 },
        { date: new Date(2021, 1, 1), value: 70 },
        { date: new Date(2021, 2, 1), value: 45 },
        { date: new Date(2021, 3, 1), value: 90 },
        { date: new Date(2021, 4, 1), value: 50 },
        { date: new Date(2021, 5, 1), value: 85 }
      ]
    };

    const years = Object.keys(dataset);

    // Setup dimensions
    const margin = { top: 20, right: 20, bottom: 30, left: 50 },
          width  = 600 - margin.left - margin.right,
          height = 400 - margin.top - margin.bottom;

    const svg = d3.select("#chart")
      .append("svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
      .append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    const x = d3.scaleTime().range([0, width]);
    const y = d3.scaleLinear().range([height, 0]);

    const line = d3.line()
      .x(d => x(d.date))
      .y(d => y(d.value));

    const xAxisGroup = svg.append("g")
      .attr("transform", `translate(0,${height})`);
    const yAxisGroup = svg.append("g");

    const path = svg.append("path")
      .attr("fill", "none")
      .attr("stroke", "steelblue")
      .attr("stroke-width", 2);

    // Populate dropdown
    const dropdown = d3.select("#yearSelect");
    dropdown.selectAll("option")
      .data(years)
      .enter()
      .append("option")
      .text(d => d)
      .attr("value", d => d);

    // Initial draw
    updateChart(years[0]);

    dropdown.on("change", function() {
      const selectedYear = this.value;
      updateChart(selectedYear);
    });

    function updateChart(year) {
      const data = dataset[year];

      x.domain(d3.extent(data, d => d.date));
      y.domain([0, d3.max(data, d => d.value)]);

      // Update axes
      xAxisGroup.transition().duration(500).call(d3.axisBottom(x));
      yAxisGroup.transition().duration(500).call(d3.axisLeft(y));

      // Update line
      path.datum(data)
        .transition()
        .duration(750)
        .attr("d", line);
    }
  </script>

</body>
</html>
